# =============================================================
# BROKEN TUNES — nginx configuration
# Sirve el frontend estático y redirige las llamadas
# a la API hacia el contenedor Flask (servicio 'api')
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Proxy hacia el backend Flask ---
    # Reemplaza el proxy de vite.config.ts en producción

    location /api/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    location /play/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

        # Necesario para streaming de audio
        proxy_buffering    off;
    }

    location /play_backup/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

        proxy_buffering    off;
    }

    # --- Frontend React (SPA) ---
    # Redirige cualquier ruta desconocida a index.html
    # para que React Router maneje la navegación

    location / {
        try_files $uri $uri/ /index.html;
    }
}