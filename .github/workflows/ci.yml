name: CI Pipeline

on:
  push:
    branches: [ develop, main ]

jobs:

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd broken-tunes-backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd broken-tunes-backend
          python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd broken-tunes-frontend
          npm install

      - name: Build frontend
        run: |
          cd broken-tunes-frontend
          npm run build